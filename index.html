<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f3ead7"><title>将棋レビュー</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f1e7;color:#27231d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}.app{width:min(100%,480px);height:calc(100dvh - 62px - env(safe-area-inset-bottom));margin:auto;padding:5px 9px;overflow:hidden}.view{display:none}.view.active{display:block}.top{height:32px;display:flex;align-items:center;justify-content:space-between;gap:5px}.top h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{font-size:10px;background:#fff;padding:4px 6px;border-radius:99px;white-space:nowrap}.boardWrap{background:#d9aa62;padding:4px;border:2px solid #5d4325;border-radius:8px;width:min(100%,43dvh);margin:2px auto 0}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));background:#e7b96d;overflow:hidden}.sq{position:relative;min-width:0;min-height:0;border-right:1px solid #70512c;border-bottom:1px solid #70512c;overflow:hidden}.sq:nth-child(9n){border-right:0}.sq:nth-last-child(-n+9){border-bottom:0}.piece{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:clamp(13px,4.15vw,20px);line-height:1;white-space:nowrap;transform:none!important;-webkit-transform:none!important;writing-mode:horizontal-tb!important;text-orientation:mixed!important}.piece.gote{transform:none!important;-webkit-transform:none!important}.hands{display:flex;justify-content:space-between;gap:4px;font-size:9px;line-height:1.1;margin:3px 0 0;white-space:nowrap;overflow:hidden}.nav{display:grid;grid-template-columns:42px 1fr 42px;gap:5px;margin:4px 0}.nav button{border:0;border-radius:9px;background:#fff;min-height:37px;font-size:16px}.move{text-align:center;background:#fff;border-radius:9px;padding:3px}.move b{font-size:14px}.move small{display:block;color:#777;font-size:10px}.timeline{display:flex;gap:2px;margin:2px 0}.bar{height:4px;flex:1;background:#ddd;border-radius:3px}.bar.hot{background:#d85b4d}.card{background:#fff;border-radius:11px;padding:7px;margin:3px 0}.normal{text-align:center;color:#6c675f;font-size:10px;padding:6px}.warn{border-left:4px solid #d4503f}.warn h2{font-size:13px;margin:0 0 3px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:4px}.choice{padding:4px;border-radius:7px;background:#f7f4ed;font-size:10px}.choice small{display:block;color:#777}.choice strong{font-size:14px}.bad{border:1.5px solid #d75a4b}.good{border:1.5px solid #4d9b62}.loss{margin:3px 0;padding:3px 5px;border-radius:6px;background:#fff1ed;font-weight:700;font-size:10px}.comment{font-size:10px;line-height:1.2}.jump,.primary{width:100%;border:0;border-radius:8px;background:#2f6e4f;color:#fff;font-weight:700;padding:6px;font-size:11px;margin-top:2px}.tabs{position:fixed;bottom:0;left:0;right:0;height:calc(62px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}.tab{width:min(96px,25vw);text-align:center;padding:5px 2px;font-size:9px;color:#777}.tab b{display:block;font-size:16px}.tab.active{color:#2f6e4f}#reviewView.active{display:flex;flex-direction:column;height:100%;overflow:hidden}#reviewView .top,#reviewView .boardWrap,#reviewView .nav,#reviewView .timeline,#reviewView #review,#reviewView .jump{flex:0 0 auto}.sub{font-size:10px;color:#746d62}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stat,.gameRow,.lesson{background:#fff;border-radius:10px;padding:8px;margin:5px 0;font-size:11px}.gameRow{display:flex}.grow{flex:1}.lesson{background:#fff7df}@media(max-height:720px){.boardWrap{width:min(100%,39dvh)}.piece{font-size:clamp(12px,3.8vw,18px)}.comment{display:none}.jump{padding:5px}.top{height:28px}}</style></head><body><div class="app"><section id="home" class="view active"><div class="top"><h1>将棋レビュー</h1><span class="pill">水匠5</span></div><div class="card"><b>前回の感想戦</b><div id="homeGame" class="sub"></div><button class="primary" onclick="showView('reviewView')">盤面を開く</button></div><div class="stats"><div class="stat"><b id="issueCount">-</b><br>課題</div><div class="stat"><b>○</b><br>危険察知</div><div class="stat"><b>△</b><br>序盤</div></div></section><section id="games" class="view"><div class="top"><h1>棋譜</h1></div><div id="gameList"></div></section><section id="reviewView" class="view"><div class="top"><h1 id="title">感想戦</h1><span class="pill" id="result"></span></div><div class="boardWrap"><div class="board" id="board"></div><div class="hands"><span id="shand"></span><span id="ghand"></span></div></div><div class="nav"><button onclick="step(-1)">◀</button><div class="move"><b id="last"></b><small id="counter"></small></div><button onclick="step(1)">▶</button></div><div class="timeline" id="timeline"></div><div id="review"></div><button class="jump" onclick="nextIssue()">⚠ 次の課題局面へ</button></section><section id="analysis" class="view"><div class="top"><h1>分析</h1></div><div class="lesson"><b>あかね戦</b><br>危険察知 ○　受け ○　攻守切替 ○　序盤 △</div></section></div><nav class="tabs"><div class="tab active" data-v="home" onclick="showView('home')"><b>⌂</b>ホーム</div><div class="tab" data-v="games" onclick="showView('games')"><b>☗</b>棋譜</div><div class="tab" data-v="reviewView" onclick="showView('reviewView')"><b>🔍</b>感想戦</div><div class="tab" data-v="analysis" onclick="showView('analysis')"><b>▥</b>分析</div></nav><script>let D,ply=0;const jp={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛',K:'玉','+P':'と','+L':'杏','+N':'圭','+S':'全','+B':'馬','+R':'龍'};function showView(id){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.v===id));if(id==='reviewView'&&D)render()}function parseSFEN(s){let[b,turn,h]=s.split(' '),cells=[];for(let r of b.split('/')){let prom=false;for(let c of r){if(/[1-9]/.test(c)){for(let i=0;i<+c;i++)cells.push(null)}else if(c==='+')prom=true;else{let side=c===c.toUpperCase()?'b':'w',key=(prom?'+':'')+c.toUpperCase();cells.push({side,key});prom=false}}}return{cells,turn,h}}function splitHands(h){if(h==='-')return{b:'なし',w:'なし'};let out={b:[],w:[]},n='';for(let c of h){if(/[0-9]/.test(c)){n+=c;continue}let side=c===c.toUpperCase()?'b':'w',piece=jp[c.toUpperCase()]||c,count=n?+n:1;out[side].push(piece+(count>1?'×'+count:''));n=''}return{b:out.b.join(' ')||'なし',w:out.w.join(' ')||'なし'}}function render(){if(!D)return;let p=D.positions[ply],x=parseSFEN(p.sfen),bd=document.getElementById('board');bd.replaceChildren();x.cells.forEach(q=>{let e=document.createElement('div');e.className='sq';if(q){let k=document.createElement('span');k.className='piece '+(q.side==='w'?'gote':'sente');k.textContent=jp[q.key]||q.key;e.appendChild(k)}bd.appendChild(e)});document.getElementById('last').textContent=p.last;document.getElementById('counter').textContent=`${ply} / ${D.game.moves}手`;let h=splitHands(x.h);document.getElementById('shand').textContent='☗ '+h.b;document.getElementById('ghand').textContent='☖ '+h.w;let issue=D.issues.find(i=>i.ply===ply);document.getElementById('review').innerHTML=issue?`<div class="card warn"><h2>⚠ ここが課題局面</h2><div class="compare"><div class="choice bad"><small>実戦手</small><strong>${issue.move}</strong> ❌</div><div class="choice good"><small>水匠5推奨</small><strong>${usi(issue.best)}</strong> ⭐</div></div><div class="loss">評価値損失 約${issue.loss}点</div><div class="comment">${issue.comment}</div></div>`:'<div class="card normal">大きな課題判定なし。▶で進められます。</div>';document.querySelectorAll('.bar').forEach((e,i)=>e.classList.toggle('hot',D.issues.some(z=>Math.round(z.ply/D.game.moves*19)===i)))}function usi(m){if(!m)return'-';const f={'1':'１','2':'２','3':'３','4':'４','5':'５','6':'６','7':'７','8':'８','9':'９'},r={a:'一',b:'二',c:'三',d:'四',e:'五',f:'六',g:'七',h:'八',i:'九'};if(m.includes('*'))return'△'+f[m[2]]+r[m[3]]+(jp[m[0]]||m[0])+'打';return'△'+f[m[2]]+r[m[3]]+(m.endsWith('+')?'成':'')}function step(n){ply=Math.max(0,Math.min(D.positions.length-1,ply+n));render()}function nextIssue(){if(!D||!D.issues.length)return;let n=D.issues.find(i=>i.ply>ply);ply=n?n.ply:D.issues[0].ply;render()}fetch('data.json?v=4').then(r=>r.json()).then(d=>{D=d;document.getElementById('title').textContent=d.game.title;document.getElementById('result').textContent=d.game.result;document.getElementById('homeGame').textContent=`${d.game.date} ${d.game.title}`;document.getElementById('issueCount').textContent=d.issues.length;document.getElementById('timeline').innerHTML='<div class="bar"></div>'.repeat(20);document.getElementById('gameList').innerHTML=`<div class="gameRow" onclick="showView('reviewView')"><div class="grow"><b>${d.game.title}</b><div class="sub">${d.game.date} / ${d.game.side} / ${d.game.moves}手</div></div>›</div>`;render()}).catch(()=>{document.getElementById('homeGame').textContent='棋譜データ読み込みエラー'});</script></body></html>
