<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3ead7"><title>将棋 感想戦</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;background:#f6f1e7;color:#27231d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;padding:12px 12px 92px}.view{display:none}.view.active{display:block}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:19px;margin:4px 0}.sub{font-size:12px;color:#746d62}.pill{font-size:12px;background:#fff;padding:6px 9px;border-radius:99px;box-shadow:0 1px 4px #0002}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 9px #0002}.hero h2{margin:0 0 5px;font-size:18px}.hero button,.primary,.jump{border:0;border-radius:10px;background:#2f6e4f;color:#fff;padding:11px 14px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{text-align:center;background:#fff;border-radius:12px;padding:10px 4px}.stat b{display:block;font-size:21px}.sectionTitle{font-size:14px;margin:16px 2px 7px}.gameRow{display:flex;align-items:center;gap:10px;background:#fff;padding:11px;border-radius:12px;margin:7px 0}.resultMark{font-size:22px}.grow{flex:1}.gameRow b{font-size:14px}.gameRow small{display:block;color:#777;margin-top:3px}.boardWrap{background:#d9aa62;padding:7px;border:2px solid #5d4325;border-radius:8px;margin-top:10px}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;background:#e7b96d}.sq{border-right:1px solid #70512c;border-bottom:1px solid #70512c;display:flex;align-items:center;justify-content:center;font-family:serif;font-weight:700;font-size:clamp(17px,5.3vw,25px)}.gote{transform:rotate(180deg)}.hands{display:flex;justify-content:space-between;font-size:12px;margin:6px 2px 0}.nav{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;margin:10px 0}.nav button{border:0;border-radius:10px;background:#fff;padding:12px;font-size:18px;box-shadow:0 1px 5px #0002}.move{text-align:center;background:#fff;border-radius:10px;padding:8px}.move b{font-size:17px}.move small{display:block;color:#777;margin-top:2px}.normal{color:#6c675f;text-align:center;padding:10px}.warn{border-left:5px solid #d4503f}.warn h2{font-size:18px;margin:0 0 10px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{padding:10px;border-radius:10px;background:#f7f4ed}.bad{border:2px solid #d75a4b}.good{border:2px solid #4d9b62}.choice small{display:block;color:#777}.choice strong{font-size:20px}.loss{margin:10px 0;padding:9px;border-radius:9px;background:#fff1ed;font-weight:700}.comment{line-height:1.55}.jump{width:100%;font-size:14px;margin-top:10px}.timeline{display:flex;gap:3px;align-items:center;margin:8px 0}.bar{height:7px;flex:1;background:#ddd;border-radius:4px}.bar.hot{background:#d85b4d}.metric{margin:12px 0}.metricHead{display:flex;justify-content:space-between;font-size:13px}.meter{height:9px;background:#e7e2d9;border-radius:9px;overflow:hidden;margin-top:5px}.meter i{display:block;height:100%;background:#2f6e4f}.lesson{background:#fff7df;border-radius:12px;padding:12px;line-height:1.5}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}.tab{width:min(96px,25vw);text-align:center;padding:9px 2px;font-size:11px;color:#777}.tab b{display:block;font-size:19px}.tab.active{color:#2f6e4f}.error{background:#fff0ee;color:#9b3329;padding:12px;border-radius:10px}</style></head><body><div class="app"><section id="home" class="view active"><div class="top"><div><h1>将棋レビュー</h1><div class="sub">sonao81 / 初段</div></div><span class="pill">水匠5</span></div><div class="card hero"><h2>前回の感想戦を続ける</h2><div id="homeGame" class="sub"></div><button onclick="showView('reviewView')" style="margin-top:10px">盤面を開く</button></div><div class="stats"><div class="stat"><b id="issueCount">-</b><small>課題局面</small></div><div class="stat"><b>○</b><small>危険察知</small></div><div class="stat"><b>△</b><small>序盤</small></div></div><h3 class="sectionTitle">今回の一番大事な課題</h3><div class="lesson">大駒が動いた直後は、攻めを急ぐ前に<strong>自玉の整備</strong>を一度確認する。</div></section><section id="games" class="view"><div class="top"><h1>棋譜</h1><span class="pill">保存済み</span></div><div id="gameList"></div><div class="card"><b>棋譜追加</b><div class="sub" style="margin:5px 0 10px">次段階でKIFファイルの直接読み込みに対応します。</div><button class="primary" disabled style="opacity:.5">＋ KIFを読み込む</button></div></section><section id="reviewView" class="view"><div class="top"><h1 id="title">感想戦</h1><span class="pill" id="result"></span></div><div class="boardWrap"><div class="board" id="board"></div><div class="hands"><span id="shand"></span><span id="ghand"></span></div></div><div class="nav"><button onclick="step(-1)">◀</button><div class="move"><b id="last"></b><small id="counter"></small></div><button onclick="step(1)">▶</button></div><div class="timeline" id="timeline"></div><div id="review"></div><button class="jump" onclick="nextIssue()">⚠ 次の課題局面へ</button></section><section id="analysis" class="view"><div class="top"><h1>分析</h1><span class="pill">あかね戦</span></div><div class="card"><b>対局診断</b><div class="metric"><div class="metricHead"><span>危険察知</span><strong>○</strong></div><div class="meter"><i style="width:70%"></i></div></div><div class="metric"><div class="metricHead"><span>受け</span><strong>○</strong></div><div class="meter"><i style="width:68%"></i></div></div><div class="metric"><div class="metricHead"><span>攻守切替</span><strong>○</strong></div><div class="meter"><i style="width:66%"></i></div></div><div class="metric"><div class="metricHead"><span>序盤</span><strong>△</strong></div><div class="meter"><i style="width:42%"></i></div></div></div><div class="lesson"><strong>水匠5の結論</strong><br>この敗戦は「危険を見落として負けた」対局ではありません。かなり早い段階で形勢を苦しくしており、まず序盤〜中盤入口を直すのが優先です。</div></section></div><nav class="tabs"><div class="tab active" data-v="home" onclick="showView('home')"><b>⌂</b>ホーム</div><div class="tab" data-v="games" onclick="showView('games')"><b>☗</b>棋譜</div><div class="tab" data-v="reviewView" onclick="showView('reviewView')"><b>🔍</b>感想戦</div><div class="tab" data-v="analysis" onclick="showView('analysis')"><b>▥</b>分析</div></nav><script>let D,ply=0;const jp={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛',K:'玉','+P':'と','+L':'杏','+N':'圭','+S':'全','+B':'馬','+R':'龍'};function showView(id){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.v===id));if(id==='reviewView'&&D)render();scrollTo(0,0)}function parseSFEN(s){let[b,turn,h]=s.split(' '),cells=[];for(let r of b.split('/')){let prom=false;for(let c of r){if(/[1-9]/.test(c)){for(let i=0;i<+c;i++)cells.push(null)}else if(c==='+')prom=true;else{let side=c===c.toUpperCase()?'b':'w',key=(prom?'+':'')+c.toUpperCase();cells.push({side,key});prom=false}}}return{cells,turn,h}}function splitHands(h){if(h==='-')return{b:'なし',w:'なし'};let out={b:[],w:[]},n='';for(let c of h){if(/[0-9]/.test(c)){n+=c;continue}let side=c===c.toUpperCase()?'b':'w',piece=jp[c.toUpperCase()]||c,count=n?+n:1;out[side].push(piece+(count>1?'×'+count:''));n=''}return{b:out.b.join(' ')||'なし',w:out.w.join(' ')||'なし'}}function render(){if(!D)return;let p=D.positions[ply],x=parseSFEN(p.sfen),bd=document.querySelector('#board');bd.innerHTML='';x.cells.forEach(q=>{let e=document.createElement('div');e.className='sq';if(q){e.textContent=jp[q.key]||q.key;if(q.side==='w')e.classList.add('gote')}bd.appendChild(e)});last.textContent=p.last;counter.textContent=`${ply} / ${D.game.moves}手`;let h=splitHands(x.h);shand.textContent='☗ '+h.b;ghand.textContent='☖ '+h.w;let issue=D.issues.find(i=>i.ply===ply);review.innerHTML=issue?`<div class="card warn"><h2>⚠️ ここが課題局面</h2><div class="compare"><div class="choice bad"><small>実戦手</small><strong>${issue.move}</strong><div>❌</div></div><div class="choice good"><small>水匠5 推奨</small><strong>${usi(issue.best)}</strong><div>⭐</div></div></div><div class="loss">📉 評価値損失 約${issue.loss}点</div><div class="comment">💬 ${issue.comment}</div></div>`:'<div class="card normal">この局面には大きな課題判定はありません。<br>▶で一手ずつ進められます。</div>';document.querySelectorAll('.bar').forEach((e,i)=>e.classList.toggle('hot',D.issues.some(z=>Math.round(z.ply/D.game.moves*19)===i)))}function usi(m){if(!m)return'-';const file={'1':'１','2':'２','3':'３','4':'４','5':'５','6':'６','7':'７','8':'８','9':'９'},rank={a:'一',b:'二',c:'三',d:'四',e:'五',f:'六',g:'七',h:'八',i:'九'};if(m.includes('*'))return'△'+file[m[2]]+rank[m[3]]+(jp[m[0]]||m[0])+'打';return'△'+file[m[2]]+rank[m[3]]+(m.endsWith('+')?'成':'')}function step(n){ply=Math.max(0,Math.min(D.positions.length-1,ply+n));render()}function nextIssue(){if(!D.issues.length)return;let n=D.issues.find(i=>i.ply>ply);ply=n?n.ply:D.issues[0].ply;render()}function loadGame(d){D=d;title.textContent=d.game.title;result.textContent=d.game.result;homeGame.textContent=`${d.game.date}　${d.game.title}　${d.game.moves}手`;issueCount.textContent=d.issues.length;timeline.innerHTML='<div class="bar"></div>'.repeat(20);gameList.innerHTML=`<div class="gameRow" onclick="showView('reviewView')"><div class="resultMark">●</div><div class="grow"><b>${d.game.title}</b><small>${d.game.date} / ${d.game.side} / ${d.game.moves}手 / 解析済み</small></div><span>›</span></div>`;localStorage.setItem('shogiReviewLastGame',JSON.stringify(d.game));render()}fetch('data.json?2').then(r=>{if(!r.ok)throw Error('data.json '+r.status);return r.json()}).then(loadGame).catch(e=>{homeGame.innerHTML='<div class="error">棋譜データを読み込めませんでした。ページを再読み込みしてください。</div>';console.error(e)});</script></body></html>
