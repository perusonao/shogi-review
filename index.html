<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#18130d"><title>将棋レビュー</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18130d;color:#f8f2e7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:none;touch-action:manipulation}.app{width:min(100%,430px);height:calc(100dvh - 58px - env(safe-area-inset-bottom));margin:auto;overflow:hidden;background:linear-gradient(#282016,#15110c);padding:4px 7px}.view{display:none}.view.active{display:block}.top{height:27px;display:flex;align-items:center;justify-content:space-between;gap:5px}.top h1{margin:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topRight{display:flex;gap:4px;align-items:center}.pill,.flip{font-size:9px;padding:3px 6px;border-radius:99px;background:#423426;color:#f7e8c8;white-space:nowrap;border:0}.flip{font-size:12px;background:#765123}.boardShell{width:min(100%,36dvh);margin:1px auto 0;background:#9a682f;border:2px solid #d0a15e;border-radius:4px;padding:3px;box-shadow:0 2px 8px #0008}.opponentHand,.myHand{height:17px;display:flex;align-items:center;justify-content:space-between;padding:0 3px;font-size:9px;color:#fff0cc;overflow:hidden;white-space:nowrap}.opponentHand{border-bottom:1px solid #69441f}.myHand{border-top:1px solid #69441f}.boardStage{position:relative;width:100%;aspect-ratio:1}.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));background:#d7a253;border-left:1px solid #513719;border-top:1px solid #513719;overflow:hidden}.sq{position:relative;min-width:0;min-height:0;border-right:1px solid #513719;border-bottom:1px solid #513719;overflow:hidden}.piece{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:clamp(12px,3.7vw,18px);line-height:1;color:#1e1710;white-space:nowrap}.piece.gote{transform:rotate(180deg);-webkit-transform:rotate(180deg)}.flipped .piece.gote{transform:none;-webkit-transform:none}.flipped .piece.sente{transform:rotate(180deg);-webkit-transform:rotate(180deg)}.arrows{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}.controls{display:grid;grid-template-columns:40px 1fr 40px;gap:5px;margin:3px 0 2px}.controls button{border:1px solid #6d5437;border-radius:6px;background:#33291e;color:#ffd992;font-size:15px;height:30px}.move{height:30px;border:1px solid #6d5437;border-radius:6px;background:#211a13;display:flex;align-items:center;justify-content:center;gap:8px}.move b{font-size:12px}.move small{font-size:9px;color:#c8b99e}.timeline{display:flex;gap:2px;height:5px;margin:2px 0}.bar{height:4px;flex:1;background:#54483a;border-radius:3px}.bar.hot{background:#e35b43}.reviewBox{height:145px;overflow:hidden}.card{margin:2px 0;background:#292117;border:1px solid #5c4933;border-radius:7px;padding:6px}.normal{text-align:center;color:#c8bda9;font-size:10px;line-height:1.25;padding:8px}.warn{border-left:3px solid #e25a42}.warn h2{font-size:11px;margin:0 0 4px;color:#ffd590}.legend{font-size:9px;margin-bottom:4px}.red{color:#ff6b5a}.green{color:#62d17d}.compare{display:grid;grid-template-columns:1fr 1fr;gap:4px}.choice{padding:3px 5px;border-radius:5px;background:#1c1711;font-size:9px}.choice small{display:block;color:#9f9484}.choice strong{font-size:12px}.bad{border:1px solid #e85a49}.good{border:1px solid #54bd70}.loss{font-size:9px;margin-top:4px;color:#f0b99f}.comment{display:block;font-size:10px;line-height:1.35;margin-top:5px;color:#fff3df;white-space:normal}.jump{width:100%;height:26px;border:1px solid #876637;border-radius:6px;background:#765123;color:#ffe0a5;font-weight:700;font-size:10px;margin-top:2px}.tabs{position:fixed;bottom:0;left:0;right:0;height:calc(58px + env(safe-area-inset-bottom));background:#16120e;border-top:1px solid #5d4933;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}.tab{width:min(96px,25vw);text-align:center;padding:4px 2px;font-size:8px;color:#9e9384}.tab b{display:block;font-size:15px}.tab.active{color:#f1c679}#reviewView.active{height:100%;display:flex;flex-direction:column;overflow:hidden}#reviewView>*{flex:0 0 auto}.sub{font-size:10px;color:#b9aa96}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stat,.gameRow,.lesson,.homeCard{background:#292117;border:1px solid #5c4933;border-radius:8px;padding:8px;margin:5px 0;font-size:10px}.gameRow{display:flex}.grow{flex:1}.primary{width:100%;border:0;border-radius:6px;background:#765123;color:#ffe0a5;padding:7px}@media(max-height:740px){.boardShell{width:min(100%,31dvh)}.top{height:24px}.reviewBox{height:138px}.opponentHand,.myHand{height:15px}.controls button,.move{height:28px}}@media(max-height:650px){.boardShell{width:min(100%,27dvh)}.timeline{display:none}.reviewBox{height:130px}}</style></head><body><div class="app"><section id="home" class="view active"><div class="top"><h1>将棋レビュー</h1><span class="pill">水匠5</span></div><div class="homeCard"><b>前回の感想戦</b><div id="homeGame" class="sub"></div><button class="primary" onclick="showView('reviewView')">盤面を開く</button></div><div class="stats"><div class="stat"><b id="issueCount">-</b><br>課題</div><div class="stat"><b>○</b><br>危険察知</div><div class="stat"><b>△</b><br>序盤</div></div></section><section id="games" class="view"><div class="top"><h1>棋譜</h1></div><div id="gameList"></div></section><section id="reviewView" class="view"><div class="top"><h1 id="title">感想戦</h1><div class="topRight"><button class="flip" onclick="toggleFlip()">↕ 反転</button><span class="pill" id="result"></span></div></div><div class="boardShell" id="shell"><div class="opponentHand"><span id="topLabel">☖ 相手</span><span id="topHand"></span></div><div class="boardStage"><div class="board" id="board"></div><svg class="arrows" id="arrows" viewBox="0 0 900 900" preserveAspectRatio="none"></svg></div><div class="myHand"><span id="bottomLabel">☗ 自分</span><span id="bottomHand"></span></div></div><div class="controls"><button onclick="step(-1)">◀</button><div class="move"><b id="last"></b><small id="counter"></small></div><button onclick="step(1)">▶</button></div><div class="timeline" id="timeline"></div><div class="reviewBox" id="review"></div><button class="jump" onclick="nextIssue()">⚠ 次の課題局面へ</button></section><section id="analysis" class="view"><div class="top"><h1>分析</h1></div><div class="lesson"><b>あかね戦</b><br>危険察知 ○　受け ○　攻守切替 ○　序盤 △</div></section></div><nav class="tabs"><div class="tab active" data-v="home" onclick="showView('home')"><b>⌂</b>ホーム</div><div class="tab" data-v="games" onclick="showView('games')"><b>☗</b>棋譜</div><div class="tab" data-v="reviewView" onclick="showView('reviewView')"><b>🔍</b>感想戦</div><div class="tab" data-v="analysis" onclick="showView('analysis')"><b>▥</b>分析</div></nav><script>let D,ply=0,flipped=true;const jp={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛',K:'玉','+P':'と','+L':'杏','+N':'圭','+S':'全','+B':'馬','+R':'龍'};function showView(id){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.v===id));if(id==='reviewView'&&D)render()}function toggleFlip(){flipped=!flipped;localStorage.setItem('boardFlipped',flipped?'1':'0');render()}function parseSFEN(s){let[b,turn,h]=s.split(' '),cells=[];for(const row of b.split('/')){let prom=false;for(const c of row){if(/[1-9]/.test(c)){for(let i=0;i<Number(c);i++)cells.push(null)}else if(c==='+')prom=true;else{const side=c===c.toUpperCase()?'b':'w';cells.push({side,key:(prom?'+':'')+c.toUpperCase()});prom=false}}}while(cells.length<81)cells.push(null);return{cells:cells.slice(0,81),turn,h}}function splitHands(h){if(h==='-')return{b:'持駒なし',w:'持駒なし'};let out={b:[],w:[]},n='';for(const c of h){if(/[0-9]/.test(c)){n+=c;continue}const side=c===c.toUpperCase()?'b':'w',piece=jp[c.toUpperCase()]||c,count=n?Number(n):1;out[side].push(piece+(count>1?'×'+count:''));n=''}return{b:out.b.join(' ')||'持駒なし',w:out.w.join(' ')||'持駒なし'}}function cellCenter(file,rank){let col=9-file,row=rank-1;if(flipped){col=8-col;row=8-row}return{x:(col+.5)*100,y:(row+.5)*100}}function usiCoords(m){if(!m)return null;if(m.includes('*'))return{drop:true,to:{file:+m[2],rank:m.charCodeAt(3)-96}};return{from:{file:+m[0],rank:m.charCodeAt(1)-96},to:{file:+m[2],rank:m.charCodeAt(3)-96}}}function actualCoords(issue){const s=(D.positions[issue.ply]||{}).last||issue.move||'';const src=s.match(/\((\d)(\d)\)/);const dst=s.match(/[▲△]?([1-9１-９])([一二三四五六七八九1-9])/);if(!dst)return null;const fw='１２３４５６７８９',rk='一二三四五六七八九';let file=fw.includes(dst[1])?fw.indexOf(dst[1])+1:+dst[1],rank=rk.includes(dst[2])?rk.indexOf(dst[2])+1:+dst[2];return{drop:!src,from:src?{file:+src[1],rank:+src[2]}:null,to:{file,rank}}}function arrowLine(a,color,marker){if(!a||a.drop)return'';const p1=cellCenter(a.from.file,a.from.rank),p2=cellCenter(a.to.file,a.to.rank),dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy)||1,trim=25,ex=p2.x-dx/len*trim,ey=p2.y-dy/len*trim;return`<line x1="${p1.x}" y1="${p1.y}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width="14" stroke-linecap="round" opacity=".9" marker-end="url(#${marker})"/>`}function targetBox(a,color,label){if(!a)return'';const p=cellCenter(a.to.file,a.to.rank);return`<rect x="${p.x-45}" y="${p.y-45}" width="90" height="90" rx="10" fill="none" stroke="${color}" stroke-width="10"/><text x="${p.x}" y="${p.y+8}" text-anchor="middle" font-size="32" font-weight="700" fill="${color}">${a.drop?label:''}</text>`}function drawArrows(issue){const svg=document.getElementById('arrows');if(!issue){svg.innerHTML='';return}const a=actualCoords(issue),b=usiCoords(issue.best);svg.innerHTML=`<defs><marker id="redHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#ff4938"/></marker><marker id="greenHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#38d86a"/></marker></defs>${arrowLine(a,'#ff4938','redHead')}${targetBox(a,'#ff4938','実')}${arrowLine(b,'#38d86a','greenHead')}${targetBox(b,'#38d86a','推')}` }function render(){if(!D)return;const issue=D.issues.find(i=>i.ply===ply);let displayPly=issue?Math.max(0,ply-1):ply;const p=D.positions[displayPly],x=parseSFEN(p.sfen),bd=document.getElementById('board');bd.replaceChildren();document.getElementById('shell').classList.toggle('flipped',flipped);for(let vi=0;vi<81;vi++){const logical=flipped?80-vi:vi,e=document.createElement('div');e.className='sq';const q=x.cells[logical];if(q){const k=document.createElement('span');k.className='piece '+(q.side==='w'?'gote':'sente');k.textContent=jp[q.key]||q.key;e.appendChild(k)}bd.appendChild(e)}const shown=D.positions[ply];document.getElementById('last').textContent=issue?'指す直前：'+shown.last:shown.last;document.getElementById('counter').textContent=`${ply}/${D.game.moves}手`;const h=splitHands(x.h);if(flipped){document.getElementById('topLabel').textContent='☗ 相手';document.getElementById('topHand').textContent=h.b;document.getElementById('bottomLabel').textContent='☖ 自分';document.getElementById('bottomHand').textContent=h.w}else{document.getElementById('topLabel').textContent='☖ 相手';document.getElementById('topHand').textContent=h.w;document.getElementById('bottomLabel').textContent='☗ 自分';document.getElementById('bottomHand').textContent=h.b}drawArrows(issue);const rv=document.getElementById('review');rv.innerHTML=issue?`<div class="card warn"><h2>⚠ 課題局面</h2><div class="legend"><span class="red">● 赤＝実戦手</span>　<span class="green">● 緑＝水匠5推奨</span></div><div class="compare"><div class="choice bad"><small>実戦</small><strong>${issue.move}</strong></div><div class="choice good"><small>推奨</small><strong>${usi(issue.best)}</strong></div></div><div class="loss">評価値損失 約${issue.loss}点</div><div class="comment">💬 ${issue.comment}</div></div>`:'<div class="card normal">この局面には大きな課題判定はありません。▶で一手ずつ進められます。</div>';document.querySelectorAll('.bar').forEach((e,i)=>e.classList.toggle('hot',D.issues.some(z=>Math.round(z.ply/D.game.moves*19)===i)))}function usi(m){if(!m)return'-';const f={'1':'１','2':'２','3':'３','4':'４','5':'５','6':'６','7':'７','8':'８','9':'９'},r={a:'一',b:'二',c:'三',d:'四',e:'五',f:'六',g:'七',h:'八',i:'九'};if(m.includes('*'))return'△'+f[m[2]]+r[m[3]]+(jp[m[0]]||m[0])+'打';return'△'+f[m[2]]+r[m[3]]+(m.endsWith('+')?'成':'')}function step(n){ply=Math.max(0,Math.min(D.positions.length-1,ply+n));render()}function nextIssue(){if(!D||!D.issues.length)return;const n=D.issues.find(i=>i.ply>ply);ply=n?n.ply:D.issues[0].ply;render()}const saved=localStorage.getItem('boardFlipped');if(saved!==null)flipped=saved==='1';fetch('data.json?v=8').then(r=>r.json()).then(d=>{D=d;document.getElementById('title').textContent=d.game.title;document.getElementById('result').textContent=d.game.result;document.getElementById('homeGame').textContent=`${d.game.date} ${d.game.title}`;document.getElementById('issueCount').textContent=d.issues.length;document.getElementById('timeline').innerHTML='<div class="bar"></div>'.repeat(20);document.getElementById('gameList').innerHTML=`<div class="gameRow" onclick="showView('reviewView')"><div class="grow"><b>${d.game.title}</b><div class="sub">${d.game.date} / ${d.game.side} / ${d.game.moves}手</div></div>›</div>`;render()}).catch(()=>{document.getElementById('homeGame').textContent='棋譜データ読み込みエラー'});</script></body></html>
