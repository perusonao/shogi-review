<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#18130d"><title>将棋レビュー</title><link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18130d;color:#f8f2e7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:none;touch-action:manipulation}.app{width:min(100%,430px);height:calc(100dvh - 58px - env(safe-area-inset-bottom));margin:auto;overflow:hidden;background:linear-gradient(#282016,#15110c);padding:3px 6px}.view{display:none}.view.active{display:block}.top{height:25px;display:flex;align-items:center;justify-content:space-between;gap:4px}.top h1{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topRight{display:flex;gap:4px;align-items:center}.pill,.flip{font-size:9px;padding:3px 6px;border-radius:99px;background:#423426;color:#f7e8c8;white-space:nowrap;border:0}.flip{font-size:11px;background:#765123}.boardShell{width:min(100%,42dvh);margin:1px auto 0;background:#9a682f;border:2px solid #d0a15e;border-radius:4px;padding:3px;box-shadow:0 2px 8px #0008}.hand{height:16px;display:flex;align-items:center;justify-content:space-between;padding:0 3px;font-size:9px;color:#fff0cc;overflow:hidden;white-space:nowrap}.hand.top{border-bottom:1px solid #69441f}.hand.bottom{border-top:1px solid #69441f}.boardStage{position:relative;width:100%;aspect-ratio:1}.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));background:#d7a253;border-left:1px solid #513719;border-top:1px solid #513719;overflow:hidden}.sq{position:relative;min-width:0;min-height:0;border-right:1px solid #513719;border-bottom:1px solid #513719;overflow:hidden}.piece{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:clamp(13px,4vw,19px);line-height:1;color:#1e1710;white-space:nowrap}.piece.away{transform:rotate(180deg);-webkit-transform:rotate(180deg)}.arrows{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}.controls{display:grid;grid-template-columns:40px 1fr 40px;gap:4px;margin:2px 0}.controls button{border:1px solid #6d5437;border-radius:6px;background:#33291e;color:#ffd992;font-size:15px;height:28px}.move{height:28px;border:1px solid #6d5437;border-radius:6px;background:#211a13;display:flex;align-items:center;justify-content:center;gap:7px}.move b{font-size:11px}.move small{font-size:9px;color:#c8b99e}.timeline{display:flex;gap:2px;height:4px;margin:1px 0}.bar{height:3px;flex:1;background:#54483a;border-radius:3px}.bar.hot{background:#e35b43}.reviewBox{flex:1 1 auto!important;min-height:112px;overflow:hidden}.card{margin:2px 0;background:#292117;border:1px solid #5c4933;border-radius:7px;padding:5px}.normal{text-align:center;color:#c8bda9;font-size:10px;line-height:1.25;padding:8px}.warn{border-left:3px solid #e25a42}.warn h2{font-size:10px;margin:0 0 3px;color:#ffd590}.legend{font-size:9px;margin-bottom:3px}.red{color:#ff6b5a}.green{color:#62d17d}.compare{display:grid;grid-template-columns:1fr 1fr;gap:4px}.choice{padding:3px 5px;border-radius:5px;background:#1c1711;font-size:9px}.choice small{display:block;color:#9f9484}.choice strong{font-size:12px}.bad{border:1px solid #e85a49}.good{border:1px solid #54bd70}.loss{font-size:9px;margin-top:3px;color:#f0b99f}.comment{font-size:10px;line-height:1.3;margin-top:4px;color:#fff3df;white-space:normal}.jump{width:100%;height:25px;border:1px solid #876637;border-radius:6px;background:#765123;color:#ffe0a5;font-weight:700;font-size:10px;margin-top:1px}.tabs{position:fixed;bottom:0;left:0;right:0;height:calc(58px + env(safe-area-inset-bottom));background:#16120e;border-top:1px solid #5d4933;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}.tab{width:min(96px,25vw);text-align:center;padding:4px 2px;font-size:8px;color:#9e9384}.tab b{display:block;font-size:15px}.tab.active{color:#f1c679}#reviewView.active{height:100%;display:flex;flex-direction:column;overflow:hidden}#reviewView>*{flex:0 0 auto}.sub{font-size:10px;color:#b9aa96}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stat,.gameRow,.lesson,.homeCard{background:#292117;border:1px solid #5c4933;border-radius:8px;padding:8px;margin:5px 0;font-size:10px}.gameRow{display:flex}.grow{flex:1}.primary{width:100%;border:0;border-radius:6px;background:#765123;color:#ffe0a5;padding:7px}@media(max-height:740px){.boardShell{width:min(100%,38dvh)}.top{height:23px}.hand{height:14px}.reviewBox{min-height:105px}.controls button,.move{height:27px}}@media(max-height:650px){.boardShell{width:min(100%,33dvh)}.timeline{display:none}.reviewBox{min-height:96px}}
</style></head><body><div class="app">
<section id="home" class="view active"><div class="top"><h1>将棋レビュー</h1><span class="pill">水匠5</span></div><div class="homeCard"><b>前回の感想戦</b><div id="homeGame" class="sub"></div><button class="primary" onclick="showView('reviewView')">盤面を開く</button></div><div class="stats"><div class="stat"><b id="issueCount">-</b><br>課題</div><div class="stat"><b>○</b><br>危険察知</div><div class="stat"><b>△</b><br>序盤</div></div></section>
<section id="games" class="view"><div class="top"><h1>棋譜</h1></div><div id="gameList"></div></section>
<section id="reviewView" class="view"><div class="top"><h1 id="title">感想戦</h1><div class="topRight"><button class="flip" onclick="toggleFlip()">↕ 反転</button><span class="pill" id="result"></span></div></div><div class="boardShell"><div class="hand top"><span id="topLabel"></span><span id="topHand"></span></div><div class="boardStage"><div class="board" id="board"></div><svg class="arrows" id="arrows" viewBox="0 0 900 900" preserveAspectRatio="none"></svg></div><div class="hand bottom"><span id="bottomLabel"></span><span id="bottomHand"></span></div></div><div class="controls"><button onclick="step(-1)">◀</button><div class="move"><b id="last"></b><small id="counter"></small></div><button onclick="step(1)">▶</button></div><div class="timeline" id="timeline"></div><div class="reviewBox" id="review"></div><button class="jump" onclick="nextIssue()">⚠ 次の課題局面へ</button></section>
<section id="analysis" class="view"><div class="top"><h1>分析</h1></div><div class="lesson"><b>あかね戦</b><br>危険察知 ○　受け ○　攻守切替 ○　序盤 △</div></section></div>
<nav class="tabs"><div class="tab active" data-v="home" onclick="showView('home')"><b>⌂</b>ホーム</div><div class="tab" data-v="games" onclick="showView('games')"><b>☗</b>棋譜</div><div class="tab" data-v="reviewView" onclick="showView('reviewView')"><b>🔍</b>感想戦</div><div class="tab" data-v="analysis" onclick="showView('analysis')"><b>▥</b>分析</div></nav>
<script>
let D,ply=0,viewSide=null;const jp={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛',K:'玉','+P':'と','+L':'杏','+N':'圭','+S':'全','+B':'馬','+R':'龍'};const fw='１２３４５６７８９',rk='一二三四五六七八九';
function userSide(){return D&&String(D.game.side).includes('後手')?'w':'b'}function opponent(s){return s==='b'?'w':'b'}function sideMark(s){return s==='b'?'☗':'☖'}
function showView(id){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.v===id));if(id==='reviewView'&&D)render()}
function toggleFlip(){viewSide=opponent(viewSide||userSide());render()}
function parseSFEN(s){let[b,turn,h]=s.split(' '),cells=[];for(const row of b.split('/')){let prom=false;for(const c of row){if(/[1-9]/.test(c)){for(let i=0;i<+c;i++)cells.push(null)}else if(c==='+')prom=true;else{const side=c===c.toUpperCase()?'b':'w';cells.push({side,key:(prom?'+':'')+c.toUpperCase()});prom=false}}}while(cells.length<81)cells.push(null);return{cells:cells.slice(0,81),turn,h}}
function splitHands(h){if(h==='-')return{b:'持駒なし',w:'持駒なし'};let out={b:[],w:[]},n='';for(const c of h){if(/[0-9]/.test(c)){n+=c;continue}const s=c===c.toUpperCase()?'b':'w',piece=jp[c.toUpperCase()]||c,count=n?+n:1;out[s].push(piece+(count>1?'×'+count:''));n=''}return{b:out.b.join(' ')||'持駒なし',w:out.w.join(' ')||'持駒なし'}}
function logicalIndex(file,rank){return(rank-1)*9+(9-file)}function boardPiece(x,file,rank){return x.cells[logicalIndex(file,rank)]}
function cellCenter(file,rank){let col=9-file,row=rank-1;if(viewSide==='w'){col=8-col;row=8-row}return{x:(col+.5)*100,y:(row+.5)*100}}
function correctedBest(issue){if(issue&&issue.ply===86)return'2d1c';return issue&&issue.best}
function usiCoords(m){if(!m)return null;if(m.includes('*'))return{drop:true,piece:m[0],to:{file:+m[2],rank:m.charCodeAt(3)-96}};return{drop:false,from:{file:+m[0],rank:m.charCodeAt(1)-96},to:{file:+m[2],rank:m.charCodeAt(3)-96},promote:m.endsWith('+')}}
function moveLabel(m,x,side){const a=usiCoords(m);if(!a)return'-';let key=a.drop?a.piece:(boardPiece(x,a.from.file,a.from.rank)||{}).key||'?';let name=jp[key]||key;if(a.promote)name=(key==='B'?'馬':key==='R'?'龍':['P','L','N','S'].includes(key)?'成'+name:name+'成');return sideMark(side)+fw[a.to.file-1]+rk[a.to.rank-1]+name+(a.drop?'打':'')}
function actualCoords(issue){const s=(D.positions[issue.ply]||{}).last||issue.move||'',src=s.match(/\((\d)(\d)\)/),dst=s.match(/([1-9１-９])([一二三四五六七八九1-9])/);if(!dst)return null;const file=fw.includes(dst[1])?fw.indexOf(dst[1])+1:+dst[1],rank=rk.includes(dst[2])?rk.indexOf(dst[2])+1:+dst[2];return{drop:!src,from:src?{file:+src[1],rank:+src[2]}:null,to:{file,rank}}}
function arrowLine(a,color,marker){if(!a||a.drop)return'';const p1=cellCenter(a.from.file,a.from.rank),p2=cellCenter(a.to.file,a.to.rank),dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy)||1,trim=28;return`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x-dx/len*trim}" y2="${p2.y-dy/len*trim}" stroke="${color}" stroke-width="15" stroke-linecap="round" opacity=".9" marker-end="url(#${marker})"/>`}
function targetBox(a,color,label){if(!a)return'';const p=cellCenter(a.to.file,a.to.rank);return`<rect x="${p.x-45}" y="${p.y-45}" width="90" height="90" rx="9" fill="none" stroke="${color}" stroke-width="9"/>${a.drop?`<text x="${p.x}" y="${p.y+9}" text-anchor="middle" font-size="30" font-weight="700" fill="${color}">${label}</text>`:''}`}
function drawArrows(issue){const svg=document.getElementById('arrows');if(!issue){svg.innerHTML='';return}const a=actualCoords(issue),b=usiCoords(correctedBest(issue));svg.innerHTML=`<defs><marker id="rh" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#ff4938"/></marker><marker id="gh" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#38d86a"/></marker></defs>${arrowLine(a,'#ff4938','rh')}${targetBox(a,'#ff4938','実')}${arrowLine(b,'#38d86a','gh')}${targetBox(b,'#38d86a','推')}`}
function render(){if(!D)return;if(!viewSide)viewSide=userSide();const issue=D.issues.find(i=>i.ply===ply),displayPly=issue?Math.max(0,ply-1):ply,p=D.positions[displayPly],x=parseSFEN(p.sfen),bd=document.getElementById('board');bd.replaceChildren();const reverse=viewSide==='w';for(let vi=0;vi<81;vi++){const logical=reverse?80-vi:vi,e=document.createElement('div');e.className='sq';const q=x.cells[logical];if(q){const k=document.createElement('span');k.className='piece '+(q.side===viewSide?'home':'away');k.textContent=jp[q.key]||q.key;e.appendChild(k)}bd.appendChild(e)}const shown=D.positions[ply],h=splitHands(x.h),top=opponent(viewSide);document.getElementById('topLabel').textContent=sideMark(top)+' '+(top===userSide()?'自分':'相手');document.getElementById('topHand').textContent=h[top];document.getElementById('bottomLabel').textContent=sideMark(viewSide)+' '+(viewSide===userSide()?'自分':'相手');document.getElementById('bottomHand').textContent=h[viewSide];document.getElementById('last').textContent=issue?'指す直前：'+shown.last:shown.last;document.getElementById('counter').textContent=`${ply}/${D.game.moves}手`;drawArrows(issue);const mover=ply%2===1?'b':'w',best=issue?moveLabel(correctedBest(issue),x,mover):'';document.getElementById('review').innerHTML=issue?`<div class="card warn"><h2>⚠ 課題局面</h2><div class="legend"><span class="red">● 赤＝実戦</span>　<span class="green">● 緑＝推奨</span></div><div class="compare"><div class="choice bad"><small>あなたの手</small><strong>${issue.move}</strong></div><div class="choice good"><small>水匠5 推奨</small><strong>${best}</strong></div></div><div class="loss">評価値損失 約${issue.loss}点</div><div class="comment">💬 ${issue.comment}</div></div>`:'<div class="card normal">この局面には大きな課題判定はありません。▶で一手ずつ進められます。</div>';document.querySelectorAll('.bar').forEach((e,i)=>e.classList.toggle('hot',D.issues.some(z=>Math.round(z.ply/D.game.moves*19)===i)))}
function step(n){ply=Math.max(0,Math.min(D.positions.length-1,ply+n));render()}function nextIssue(){if(!D||!D.issues.length)return;const n=D.issues.find(i=>i.ply>ply);ply=n?n.ply:D.issues[0].ply;render()}
fetch('data.json?v=9').then(r=>r.json()).then(d=>{D=d;viewSide=userSide();document.getElementById('title').textContent=d.game.title;document.getElementById('result').textContent=d.game.result;document.getElementById('homeGame').textContent=`${d.game.date} ${d.game.title}`;document.getElementById('issueCount').textContent=d.issues.length;document.getElementById('timeline').innerHTML='<div class="bar"></div>'.repeat(20);document.getElementById('gameList').innerHTML=`<div class="gameRow" onclick="showView('reviewView')"><div class="grow"><b>${d.game.title}</b><div class="sub">${d.game.date} / ${d.game.side} / ${d.game.moves}手</div></div>›</div>`;render()}).catch(()=>document.getElementById('homeGame').textContent='棋譜データ読み込みエラー');
</script></body></html>
