<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3ead7"><title>将棋 感想戦</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;background:#f6f1e7;color:#27231d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;padding:12px 12px 92px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:18px;margin:4px 0}.pill{font-size:12px;background:#fff;padding:6px 9px;border-radius:99px;box-shadow:0 1px 4px #0002}.boardWrap{background:#d9aa62;padding:7px;border:2px solid #5d4325;border-radius:8px;margin-top:10px}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;background:#e7b96d}.sq{border-right:1px solid #70512c;border-bottom:1px solid #70512c;display:flex;align-items:center;justify-content:center;font-family:serif;font-weight:700;font-size:clamp(17px,5.3vw,25px)}.gote{transform:rotate(180deg)}.hands{display:flex;justify-content:space-between;font-size:12px;margin:6px 2px 0}.nav{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;margin:10px 0}.nav button,.jump{border:0;border-radius:10px;background:#fff;padding:12px;font-size:18px;box-shadow:0 1px 5px #0002}.move{text-align:center;background:#fff;border-radius:10px;padding:8px}.move b{font-size:17px}.move small{display:block;color:#777;margin-top:2px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 9px #0002}.normal{color:#6c675f;text-align:center;padding:10px}.warn{border-left:5px solid #d4503f}.warn h2{font-size:18px;margin:0 0 10px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{padding:10px;border-radius:10px;background:#f7f4ed}.bad{border:2px solid #d75a4b}.good{border:2px solid #4d9b62}.choice small{display:block;color:#777}.choice strong{font-size:20px}.loss{margin:10px 0;padding:9px;border-radius:9px;background:#fff1ed;font-weight:700}.comment{line-height:1.55}.jump{width:100%;font-size:14px;margin-top:10px;background:#2f6e4f;color:#fff}.timeline{display:flex;gap:3px;align-items:center;margin:8px 0}.bar{height:7px;flex:1;background:#ddd;border-radius:4px}.bar.hot{background:#d85b4d}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.tabs div{width:min(96px,25vw);text-align:center;padding:10px 2px;font-size:11px}.tabs b{display:block;font-size:19px}.active{color:#2f6e4f}</style></head><body><div class="app"><div class="top"><h1 id="title"></h1><span class="pill" id="result"></span></div><div class="boardWrap"><div class="board" id="board"></div><div class="hands"><span id="shand"></span><span id="ghand"></span></div></div><div class="nav"><button onclick="step(-1)">◀</button><div class="move"><b id="last"></b><small id="counter"></small></div><button onclick="step(1)">▶</button></div><div class="timeline" id="timeline"></div><div id="review"></div><button class="jump" onclick="nextIssue()">⚠ 次の課題局面へ</button></div><div class="tabs"><div><b>⌂</b>ホーム</div><div><b>☗</b>棋譜</div><div class="active"><b>🔍</b>感想戦</div><div><b>▥</b>分析</div></div><script>let D,ply=0;const jp={'P':'歩','L':'香','N':'桂','S':'銀','G':'金','B':'角','R':'飛','K':'玉','+P':'と','+L':'杏','+N':'圭','+S':'全','+B':'馬','+R':'龍'};function parseSFEN(s){let[b,turn,h]=s.split(' ');let rows=b.split('/'),cells=[];for(let r of rows){let prom=false;for(let c of r){if(/[1-9]/.test(c)){for(let i=0;i<+c;i++)cells.push(null)}else if(c==='+')prom=true;else{let side=c===c.toUpperCase()?'b':'w',key=(prom?'+':'')+c.toUpperCase();cells.push({side,key});prom=false}}}return{cells,turn,h}}function render(){let p=D.positions[ply],x=parseSFEN(p.sfen),bd=document.querySelector('#board');bd.innerHTML='';x.cells.forEach(q=>{let e=document.createElement('div');e.className='sq';if(q){e.textContent=jp[q.key]||q.key;if(q.side==='w')e.classList.add('gote')}bd.appendChild(e)});last.textContent=p.last;counter.textContent=`${ply} / ${D.game.moves}手`;shand.textContent='☗ 持駒 '+hand(x.h);ghand.textContent='☖ 持駒 '+hand(x.h);let issue=D.issues.find(i=>i.ply===ply);review.innerHTML=issue?`<div class="card warn"><h2>⚠️ ここが課題局面</h2><div class="compare"><div class="choice bad"><small>実戦手</small><strong>${issue.move}</strong><div>❌</div></div><div class="choice good"><small>水匠5 推奨</small><strong>${usi(issue.best)}</strong><div>⭐</div></div></div><div class="loss">📉 評価値損失 約${issue.loss}点</div><div class="comment">💬 ${issue.comment}</div></div>`:'<div class="card normal">この局面には大きな課題判定はありません。<br>▶で一手ずつ進められます。</div>';document.querySelectorAll('.bar').forEach((e,i)=>e.classList.toggle('hot',D.issues.some(z=>Math.round(z.ply/D.game.moves*19)===i)))}function hand(h){return h==='-'?'なし':h}function usi(m){if(!m)return'-';if(m.includes('*'))return'△'+m[2]+m[0]+'打';return'△'+m.slice(2,4)}function step(n){ply=Math.max(0,Math.min(D.positions.length-1,ply+n));render()}function nextIssue(){let n=D.issues.find(i=>i.ply>ply);ply=n?n.ply:D.issues[0].ply;render()}fetch('data.json').then(r=>r.json()).then(d=>{D=d;title.textContent=d.game.title;result.textContent=d.game.result;timeline.innerHTML='<div class="bar"></div>'.repeat(20);render()});</script></body></html>
