<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#18130d"><title>将棋レビュー</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18130d;color:#f8f2e7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:none}.app{width:min(100%,430px);height:calc(100dvh - 58px - env(safe-area-inset-bottom));margin:auto;overflow:hidden;background:linear-gradient(#282016,#15110c);padding:3px 6px}.view{display:none}.view.active{display:block}.top{height:25px;display:flex;align-items:center;justify-content:space-between;gap:4px}.top h1{margin:0;font-size:13px}.topRight{display:flex;gap:4px;align-items:center}.pill,.flip{font-size:9px;padding:3px 6px;border-radius:99px;background:#423426;color:#f7e8c8;border:0}.flip{font-size:11px;background:#765123}.boardShell{width:min(100%,42dvh);margin:1px auto 0;background:#9a682f;border:2px solid #d0a15e;border-radius:4px;padding:3px;box-shadow:0 2px 8px #0008}.hand{height:24px;display:flex;align-items:center;gap:4px;padding:1px 3px;color:#fff0cc;overflow:hidden}.hand.top{border-bottom:1px solid #69441f}.hand.bottom{border-top:1px solid #69441f}.handLabel{font-size:9px;white-space:nowrap;min-width:38px}.handPieces{display:flex;gap:3px;align-items:center;flex:1;justify-content:flex-end}.handPiece{position:relative;display:inline-flex;align-items:center;justify-content:center;width:22px;height:20px;background:#d7a253;color:#1e1710;border:1px solid #60401e;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:13px}.handPiece.away{transform:rotate(180deg)}.handCount{position:absolute;right:-1px;bottom:-2px;min-width:11px;height:11px;border-radius:6px;background:#20170f;color:#fff;font:700 8px/11px sans-serif;text-align:center;transform:none}.emptyHand{font-size:8px;opacity:.65}.boardStage{position:relative;width:100%;aspect-ratio:1}.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);background:#d7a253;border-left:1px solid #513719;border-top:1px solid #513719}.sq{position:relative;border-right:1px solid #513719;border-bottom:1px solid #513719;overflow:hidden}.piece{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:clamp(13px,4vw,19px);color:#1e1710}.piece.away{transform:rotate(180deg)}.arrows{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}.controls{display:grid;grid-template-columns:40px 1fr 40px;gap:4px;margin:2px 0}.controls button{border:1px solid #6d5437;border-radius:6px;background:#33291e;color:#ffd992;font-size:15px;height:28px}.move{height:28px;border:1px solid #6d5437;border-radius:6px;background:#211a13;display:flex;align-items:center;justify-content:center;gap:7px}.move b{font-size:11px}.move small{font-size:9px;color:#c8b99e}.evalWrap{height:58px;border:1px solid #5c4933;border-radius:6px;background:#211a13;margin:2px 0;padding:2px 5px}.evalHead{height:12px;display:flex;justify-content:space-between;font-size:8px;color:#c8b99e}.evalHead strong{color:#f5d49c;font-size:9px}.evalSvg{display:block;width:100%;height:40px}.reviewBox{flex:0 0 auto!important;overflow:hidden}.card{margin:2px 0;background:#292117;border:1px solid #5c4933;border-radius:7px;padding:5px}.normal{text-align:center;color:#c8bda9;font-size:10px;padding:7px}.warn{border-left:3px solid #e25a42}.warn h2{font-size:10px;margin:0 0 3px;color:#ffd590}.legend{font-size:9px;margin-bottom:3px}.red{color:#ff6b5a}.green{color:#62d17d}.compare{display:grid;grid-template-columns:1fr 1fr;gap:4px}.choice{padding:3px 5px;border-radius:5px;background:#1c1711;font-size:9px}.choice small{display:block;color:#9f9484}.choice strong{font-size:12px}.bad{border:1px solid #e85a49}.good{border:1px solid #54bd70}.loss{font-size:9px;margin-top:3px;color:#f0b99f}.comment{font-size:10px;line-height:1.3;margin-top:4px;color:#fff3df}.jump{width:100%;height:27px;border:1px solid #876637;border-radius:6px;background:#765123;color:#ffe0a5;font-weight:700;font-size:10px;margin:3px 0 0}.tabs{position:fixed;bottom:0;left:0;right:0;height:calc(58px + env(safe-area-inset-bottom));background:#16120e;border-top:1px solid #5d4933;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}.tab{width:min(96px,25vw);text-align:center;padding:4px 2px;font-size:8px;color:#9e9384}.tab b{display:block;font-size:15px}.tab.active{color:#f1c679}#reviewView.active{height:100%;display:flex;flex-direction:column;overflow:hidden}#reviewView>*{flex:0 0 auto}.sub{font-size:10px;color:#b9aa96}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stat,.gameRow,.lesson,.homeCard{background:#292117;border:1px solid #5c4933;border-radius:8px;padding:8px;margin:5px 0;font-size:10px}.gameRow{display:flex}.grow{flex:1}.primary{width:100%;border:0;border-radius:6px;background:#765123;color:#ffe0a5;padding:7px}@media(max-height:740px){.boardShell{width:min(100%,37dvh)}.hand{height:21px}.evalWrap{height:51px}.evalSvg{height:33px}.top{height:23px}}@media(max-height:650px){.boardShell{width:min(100%,31dvh)}.evalWrap{height:45px}.evalSvg{height:27px}.comment{font-size:9px}}
</style></head><body><div class="app">
<section id="home" class="view active"><div class="top"><h1>将棋レビュー</h1><span class="pill">水匠5</span></div><div class="homeCard"><b>前回の感想戦</b><div id="homeGame" class="sub"></div><button class="primary" onclick="showView('reviewView')">盤面を開く</button></div><div class="stats"><div class="stat"><b id="issueCount">-</b><br>課題</div><div class="stat"><b>○</b><br>危険察知</div><div class="stat"><b>△</b><br>序盤</div></div></section>
<section id="games" class="view"><div class="top"><h1>棋譜</h1></div><div id="gameList"></div></section>
<section id="reviewView" class="view"><div class="top"><h1 id="title">感想戦</h1><div class="topRight"><button class="flip" onclick="toggleFlip()">↕ 反転</button><span class="pill" id="result"></span></div></div><div class="boardShell"><div class="hand top"><span class="handLabel" id="topLabel"></span><span class="handPieces" id="topHand"></span></div><div class="boardStage"><div class="board" id="board"></div><svg class="arrows" id="arrows" viewBox="0 0 900 900"></svg></div><div class="hand bottom"><span class="handLabel" id="bottomLabel"></span><span class="handPieces" id="bottomHand"></span></div></div><div class="controls"><button onclick="step(-1)">◀</button><div class="move"><b id="last"></b><small id="counter"></small></div><button onclick="step(1)">▶</button></div><div class="evalWrap"><div class="evalHead"><span>相手有利</span><strong id="evalText">評価値</strong><span>自分有利</span></div><svg class="evalSvg" id="evalGraph" viewBox="0 0 400 100" preserveAspectRatio="none"></svg></div><div class="reviewBox" id="review"></div><button class="jump" onclick="nextIssue()">⚠ 次の課題局面へ</button></section>
<section id="analysis" class="view"><div class="top"><h1>分析</h1></div><div class="lesson"><b>あかね戦</b><br>危険察知 ○　受け ○　攻守切替 ○　序盤 △</div></section></div>
<nav class="tabs"><div class="tab active" data-v="home" onclick="showView('home')"><b>⌂</b>ホーム</div><div class="tab" data-v="games" onclick="showView('games')"><b>☗</b>棋譜</div><div class="tab" data-v="reviewView" onclick="showView('reviewView')"><b>🔍</b>感想戦</div><div class="tab" data-v="analysis" onclick="showView('analysis')"><b>▥</b>分析</div></nav><script>
let D,ply=0,viewSide=null;const jp={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛',K:'玉','+P':'と','+L':'杏','+N':'圭','+S':'全','+B':'馬','+R':'龍'},fw='１２３４５６７８９',rk='一二三四五六七八九';const evalSente=[[0,206],[16,558],[25,1041],[30,2025],[56,1545],[64,2293],[82,2643],[84,3097],[86,2904],[92,3180],[96,3636],[100,3780],[104,3540],[118,5515],[128,7614],[143,6836]];
function userSide(){return D&&String(D.game.side).includes('後手')?'w':'b'}function opponent(s){return s==='b'?'w':'b'}function sideMark(s){return s==='b'?'☗':'☖'}function showView(id){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.v===id));if(id==='reviewView'&&D)render()}function toggleFlip(){viewSide=opponent(viewSide||userSide());render()}
function parseSFEN(s){let[b,turn,h]=s.split(' '),cells=[];for(const row of b.split('/')){let prom=false;for(const c of row){if(/[1-9]/.test(c)){for(let i=0;i<+c;i++)cells.push(null)}else if(c==='+')prom=true;else{const side=c===c.toUpperCase()?'b':'w';cells.push({side,key:(prom?'+':'')+c.toUpperCase()});prom=false}}}return{cells,turn,h}}
function splitHands(h){let out={b:[],w:[]};if(h==='-')return out;let n='';for(const c of h){if(/[0-9]/.test(c)){n+=c;continue}const s=c===c.toUpperCase()?'b':'w';out[s].push({key:c.toUpperCase(),count:n?+n:1});n=''}return out}function handHtml(arr,side){if(!arr.length)return'<span class="emptyHand">持駒なし</span>';return arr.map(p=>`<span class="handPiece ${side===viewSide?'':'away'}">${jp[p.key]}${p.count>1?`<i class="handCount">${p.count}</i>`:''}</span>`).join('')}
function logicalIndex(f,r){return(r-1)*9+(9-f)}function boardPiece(x,f,r){return x.cells[logicalIndex(f,r)]}function cellCenter(f,r){let col=9-f,row=r-1;if(viewSide==='w'){col=8-col;row=8-row}return{x:(col+.5)*100,y:(row+.5)*100}}function correctedBest(i){return i&&i.ply===86?'2d1c':i&&i.best}function usiCoords(m){if(!m)return null;if(m.includes('*'))return{drop:true,piece:m[0],to:{file:+m[2],rank:m.charCodeAt(3)-96}};return{drop:false,from:{file:+m[0],rank:m.charCodeAt(1)-96},to:{file:+m[2],rank:m.charCodeAt(3)-96},promote:m.endsWith('+')}}function moveLabel(m,x,side){const a=usiCoords(m);if(!a)return'-';let key=a.drop?a.piece:(boardPiece(x,a.from.file,a.from.rank)||{}).key||'?';let name=jp[key]||key;if(a.promote)name=key==='B'?'馬':key==='R'?'龍':'成'+name;return sideMark(side)+fw[a.to.file-1]+rk[a.to.rank-1]+name+(a.drop?'打':'')}
function actualCoords(i){const s=(D.positions[i.ply]||{}).last||i.move||'',src=s.match(/\((\d)(\d)\)/),dst=s.match(/([1-9１-９])([一二三四五六七八九1-9])/);if(!dst)return null;return{drop:!src,from:src?{file:+src[1],rank:+src[2]}:null,to:{file:fw.includes(dst[1])?fw.indexOf(dst[1])+1:+dst[1],rank:rk.includes(dst[2])?rk.indexOf(dst[2])+1:+dst[2]}}}function arrowLine(a,c,id){if(!a||a.drop)return'';const p=cellCenter(a.from.file,a.from.rank),q=cellCenter(a.to.file,a.to.rank),dx=q.x-p.x,dy=q.y-p.y,l=Math.hypot(dx,dy)||1;return`<line x1="${p.x}" y1="${p.y}" x2="${q.x-dx/l*28}" y2="${q.y-dy/l*28}" stroke="${c}" stroke-width="15" stroke-linecap="round" opacity=".9" marker-end="url(#${id})"/>`}function target(a,c,t){if(!a)return'';const p=cellCenter(a.to.file,a.to.rank);return`<rect x="${p.x-45}" y="${p.y-45}" width="90" height="90" rx="9" fill="none" stroke="${c}" stroke-width="9"/>${a.drop?`<text x="${p.x}" y="${p.y+9}" text-anchor="middle" font-size="30" font-weight="700" fill="${c}">${t}</text>`:''}`}function drawArrows(i){const s=document.getElementById('arrows');if(!i){s.innerHTML='';return}const a=actualCoords(i),b=usiCoords(correctedBest(i));s.innerHTML=`<defs><marker id="rh" markerUnits="userSpaceOnUse" markerWidth="45" markerHeight="45" refX="38" refY="22" orient="auto"><path d="M0,0 L0,44 L42,22 z" fill="#ff4938"/></marker><marker id="gh" markerUnits="userSpaceOnUse" markerWidth="45" markerHeight="45" refX="38" refY="22" orient="auto"><path d="M0,0 L0,44 L42,22 z" fill="#38d86a"/></marker></defs>${arrowLine(a,'#ff4938','rh')}${target(a,'#ff4938','実')}${arrowLine(b,'#38d86a','gh')}${target(b,'#38d86a','推')}`}
function evalAt(p){let a=evalSente[0],b=evalSente[evalSente.length-1];for(let i=1;i<evalSente.length;i++)if(evalSente[i][0]>=p){a=evalSente[i-1];b=evalSente[i];break}const t=b[0]===a[0]?0:(p-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*t}function drawEval(){const sign=userSide()==='b'?1:-1,vals=evalSente.map(([p,v])=>[p,v*sign]),cap=8000,pts=vals.map(([p,v])=>`${p/D.game.moves*400},${50-Math.max(-cap,Math.min(cap,v))/cap*43}`).join(' '),cx=ply/D.game.moves*400,ev=Math.round(evalAt(ply)*sign);document.getElementById('evalText').textContent=`自分 ${ev>=0?'+':''}${ev}`;document.getElementById('evalGraph').innerHTML=`<line x1="0" y1="50" x2="400" y2="50" stroke="#6c6255" stroke-width="1"/><polyline points="${pts}" fill="none" stroke="#e9bd72" stroke-width="4" vector-effect="non-scaling-stroke"/><line x1="${cx}" y1="3" x2="${cx}" y2="97" stroke="#fff" stroke-width="2" opacity=".8"/>${D.issues.map(i=>`<circle cx="${i.ply/D.game.moves*400}" cy="${50-Math.max(-cap,Math.min(cap,evalAt(i.ply)*sign))/cap*43}" r="5" fill="#e85a49"/>`).join('')}`}
function render(){if(!D)return;if(!viewSide)viewSide=userSide();const issue=D.issues.find(i=>i.ply===ply),dp=issue?Math.max(0,ply-1):ply,x=parseSFEN(D.positions[dp].sfen),bd=document.getElementById('board');bd.replaceChildren();for(let vi=0;vi<81;vi++){const q=x.cells[viewSide==='w'?80-vi:vi],e=document.createElement('div');e.className='sq';if(q){const k=document.createElement('span');k.className='piece '+(q.side===viewSide?'home':'away');k.textContent=jp[q.key]||q.key;e.appendChild(k)}bd.appendChild(e)}const h=splitHands(x.h),top=opponent(viewSide),shown=D.positions[ply];topLabel.textContent=sideMark(top)+' '+(top===userSide()?'自分':'相手');bottomLabel.textContent=sideMark(viewSide)+' '+(viewSide===userSide()?'自分':'相手');topHand.innerHTML=handHtml(h[top],top);bottomHand.innerHTML=handHtml(h[viewSide],viewSide);last.textContent=issue?'指す直前：'+shown.last:shown.last;counter.textContent=`${ply}/${D.game.moves}手`;drawArrows(issue);drawEval();const mover=ply%2?'b':'w',best=issue?moveLabel(correctedBest(issue),x,mover):'';review.innerHTML=issue?`<div class="card warn"><h2>⚠ 課題局面</h2><div class="legend"><span class="red">● 赤＝実戦</span>　<span class="green">● 緑＝推奨</span></div><div class="compare"><div class="choice bad"><small>あなたの手</small><strong>${issue.move}</strong></div><div class="choice good"><small>水匠5 推奨</small><strong>${best}</strong></div></div><div class="loss">評価値損失 約${issue.loss}点</div><div class="comment">💬 ${issue.comment}</div></div>`:'<div class="card normal">この局面には大きな課題判定はありません。▶で一手ずつ進められます。</div>'}
function step(n){ply=Math.max(0,Math.min(D.positions.length-1,ply+n));render()}function nextIssue(){const n=D.issues.find(i=>i.ply>ply);ply=n?n.ply:D.issues[0].ply;render()}fetch('data.json?v=10').then(r=>r.json()).then(d=>{D=d;viewSide=userSide();title.textContent=d.game.title;result.textContent=d.game.result;homeGame.textContent=`${d.game.date} ${d.game.title}`;issueCount.textContent=d.issues.length;gameList.innerHTML=`<div class="gameRow" onclick="showView('reviewView')"><div class="grow"><b>${d.game.title}</b><div class="sub">${d.game.date} / ${d.game.side} / ${d.game.moves}手</div></div>›</div>`;render()});
</script></body></html>
