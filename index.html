<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#18130d"><title>将棋レビュー</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18130d;color:#f8f2e7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:none;touch-action:manipulation}.app{width:min(100%,430px);height:calc(100dvh - 58px - env(safe-area-inset-bottom));margin:auto;overflow:hidden;background:linear-gradient(#282016,#15110c);padding:4px 7px}.view{display:none}.view.active{display:block}.top{height:29px;display:flex;align-items:center;justify-content:space-between;gap:6px}.top h1{margin:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{font-size:9px;padding:4px 7px;border-radius:99px;background:#423426;color:#f7e8c8;white-space:nowrap}.boardShell{width:min(100%,42dvh);margin:1px auto 0;background:#9a682f;border:2px solid #d0a15e;border-radius:4px;padding:3px;box-shadow:0 2px 8px #0008}.opponentHand,.myHand{height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 3px;font-size:9px;color:#fff0cc;overflow:hidden;white-space:nowrap}.opponentHand{border-bottom:1px solid #69441f}.myHand{border-top:1px solid #69441f}.board{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(9,11.111111%);grid-template-rows:repeat(9,11.111111%);background:#d7a253;border-left:1px solid #513719;border-top:1px solid #513719;overflow:hidden}.sq{position:relative;width:100%;height:100%;min-width:0;min-height:0;border-right:1px solid #513719;border-bottom:1px solid #513719;overflow:hidden}.piece{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:clamp(13px,4vw,19px);line-height:1;color:#1e1710;white-space:nowrap;transform:none!important;-webkit-transform:none!important}.piece.gote{color:#3a2b1c;transform:none!important;-webkit-transform:none!important}.controls{display:grid;grid-template-columns:40px 1fr 40px;gap:5px;margin:4px 0 2px}.controls button{border:1px solid #6d5437;border-radius:6px;background:#33291e;color:#ffd992;font-size:15px;min-height:34px}.move{height:34px;border:1px solid #6d5437;border-radius:6px;background:#211a13;display:flex;align-items:center;justify-content:center;gap:8px}.move b{font-size:13px}.move small{font-size:10px;color:#c8b99e}.timeline{display:flex;gap:2px;height:5px;margin:2px 0}.bar{height:4px;flex:1;background:#54483a;border-radius:3px}.bar.hot{background:#e35b43}.reviewBox{min-height:42px;max-height:91px;overflow:hidden}.card{margin:2px 0;background:#292117;border:1px solid #5c4933;border-radius:7px;padding:5px}.normal{text-align:center;color:#c8bda9;font-size:9px;line-height:1.2;padding:6px}.warn{border-left:3px solid #e25a42}.warn h2{font-size:11px;margin:0 0 3px;color:#ffd590}.compare{display:grid;grid-template-columns:1fr 1fr;gap:4px}.choice{padding:3px 5px;border-radius:5px;background:#1c1711;font-size:9px}.choice small{display:block;color:#9f9484}.choice strong{font-size:12px}.bad{border:1px solid #b84d3d}.good{border:1px solid #559765}.loss{font-size:9px;margin-top:3px;color:#f0b99f}.comment{font-size:9px;line-height:1.2;margin-top:2px}.jump{width:100%;height:27px;border:1px solid #876637;border-radius:6px;background:#765123;color:#ffe0a5;font-weight:700;font-size:10px;margin-top:2px}.tabs{position:fixed;bottom:0;left:0;right:0;height:calc(58px + env(safe-area-inset-bottom));background:#16120e;border-top:1px solid #5d4933;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}.tab{width:min(96px,25vw);text-align:center;padding:4px 2px;font-size:8px;color:#9e9384}.tab b{display:block;font-size:15px}.tab.active{color:#f1c679}#reviewView.active{height:100%;display:flex;flex-direction:column;overflow:hidden}#reviewView>*{flex:0 0 auto}.sub{font-size:10px;color:#b9aa96}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.stat,.gameRow,.lesson,.homeCard{background:#292117;border:1px solid #5c4933;border-radius:8px;padding:8px;margin:5px 0;font-size:10px}.gameRow{display:flex}.grow{flex:1}.primary{width:100%;border:0;border-radius:6px;background:#765123;color:#ffe0a5;padding:7px}@media(max-height:740px){.boardShell{width:min(100%,38dvh)}.top{height:25px}.reviewBox{max-height:72px}.comment{display:none}.jump{height:24px}.controls{margin-top:2px}.opponentHand,.myHand{height:17px}}@media(max-height:650px){.boardShell{width:min(100%,34dvh)}.timeline{display:none}.reviewBox{max-height:55px}}</style></head><body><div class="app"><section id="home" class="view active"><div class="top"><h1>将棋レビュー</h1><span class="pill">水匠5</span></div><div class="homeCard"><b>前回の感想戦</b><div id="homeGame" class="sub"></div><button class="primary" onclick="showView('reviewView')">盤面を開く</button></div><div class="stats"><div class="stat"><b id="issueCount">-</b><br>課題</div><div class="stat"><b>○</b><br>危険察知</div><div class="stat"><b>△</b><br>序盤</div></div></section><section id="games" class="view"><div class="top"><h1>棋譜</h1></div><div id="gameList"></div></section><section id="reviewView" class="view"><div class="top"><h1 id="title">感想戦</h1><span class="pill" id="result"></span></div><div class="boardShell"><div class="opponentHand"><span>☖ 相手</span><span id="ghand"></span></div><div class="board" id="board"></div><div class="myHand"><span>☗ 自分</span><span id="shand"></span></div></div><div class="controls"><button onclick="step(-1)">◀</button><div class="move"><b id="last"></b><small id="counter"></small></div><button onclick="step(1)">▶</button></div><div class="timeline" id="timeline"></div><div class="reviewBox" id="review"></div><button class="jump" onclick="nextIssue()">⚠ 次の課題局面へ</button></section><section id="analysis" class="view"><div class="top"><h1>分析</h1></div><div class="lesson"><b>あかね戦</b><br>危険察知 ○　受け ○　攻守切替 ○　序盤 △</div></section></div><nav class="tabs"><div class="tab active" data-v="home" onclick="showView('home')"><b>⌂</b>ホーム</div><div class="tab" data-v="games" onclick="showView('games')"><b>☗</b>棋譜</div><div class="tab" data-v="reviewView" onclick="showView('reviewView')"><b>🔍</b>感想戦</div><div class="tab" data-v="analysis" onclick="showView('analysis')"><b>▥</b>分析</div></nav><script>let D,ply=0;const jp={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛',K:'玉','+P':'と','+L':'杏','+N':'圭','+S':'全','+B':'馬','+R':'龍'};function showView(id){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.v===id));if(id==='reviewView'&&D)render()}function parseSFEN(s){let[b,turn,h]=s.split(' '),cells=[];for(const row of b.split('/')){let prom=false;for(const c of row){if(/[1-9]/.test(c)){for(let i=0;i<Number(c);i++)cells.push(null)}else if(c==='+')prom=true;else{const side=c===c.toUpperCase()?'b':'w';cells.push({side,key:(prom?'+':'')+c.toUpperCase()});prom=false}}}while(cells.length<81)cells.push(null);return{cells:cells.slice(0,81),turn,h}}function splitHands(h){if(h==='-')return{b:'持駒なし',w:'持駒なし'};let out={b:[],w:[]},n='';for(const c of h){if(/[0-9]/.test(c)){n+=c;continue}const side=c===c.toUpperCase()?'b':'w',piece=jp[c.toUpperCase()]||c,count=n?Number(n):1;out[side].push(piece+(count>1?'×'+count:''));n=''}return{b:out.b.join(' ')||'持駒なし',w:out.w.join(' ')||'持駒なし'}}function render(){if(!D)return;const p=D.positions[ply],x=parseSFEN(p.sfen),bd=document.getElementById('board');bd.replaceChildren();for(let i=0;i<81;i++){const e=document.createElement('div');e.className='sq';const q=x.cells[i];if(q){const k=document.createElement('span');k.className='piece'+(q.side==='w'?' gote':'');k.textContent=jp[q.key]||q.key;e.appendChild(k)}bd.appendChild(e)}document.getElementById('last').textContent=p.last;document.getElementById('counter').textContent=`${ply}/${D.game.moves}手`;const h=splitHands(x.h);document.getElementById('shand').textContent=h.b;document.getElementById('ghand').textContent=h.w;const issue=D.issues.find(i=>i.ply===ply),rv=document.getElementById('review');rv.innerHTML=issue?`<div class="card warn"><h2>⚠ 課題局面</h2><div class="compare"><div class="choice bad"><small>実戦</small><strong>${issue.move}</strong> ×</div><div class="choice good"><small>水匠5</small><strong>${usi(issue.best)}</strong> ★</div></div><div class="loss">評価値損失 約${issue.loss}点</div><div class="comment">${issue.comment}</div></div>`:'<div class="card normal">大きな課題なし　▶ 一手進む</div>';document.querySelectorAll('.bar').forEach((e,i)=>e.classList.toggle('hot',D.issues.some(z=>Math.round(z.ply/D.game.moves*19)===i)))}function usi(m){if(!m)return'-';const f={'1':'１','2':'２','3':'３','4':'４','5':'５','6':'６','7':'７','8':'８','9':'９'},r={a:'一',b:'二',c:'三',d:'四',e:'五',f:'六',g:'七',h:'八',i:'九'};if(m.includes('*'))return'△'+f[m[2]]+r[m[3]]+(jp[m[0]]||m[0])+'打';return'△'+f[m[2]]+r[m[3]]+(m.endsWith('+')?'成':'')}function step(n){ply=Math.max(0,Math.min(D.positions.length-1,ply+n));render()}function nextIssue(){if(!D||!D.issues.length)return;const n=D.issues.find(i=>i.ply>ply);ply=n?n.ply:D.issues[0].ply;render()}fetch('data.json?v=5').then(r=>r.json()).then(d=>{D=d;document.getElementById('title').textContent=d.game.title;document.getElementById('result').textContent=d.game.result;document.getElementById('homeGame').textContent=`${d.game.date} ${d.game.title}`;document.getElementById('issueCount').textContent=d.issues.length;document.getElementById('timeline').innerHTML='<div class="bar"></div>'.repeat(20);document.getElementById('gameList').innerHTML=`<div class="gameRow" onclick="showView('reviewView')"><div class="grow"><b>${d.game.title}</b><div class="sub">${d.game.date} / ${d.game.side} / ${d.game.moves}手</div></div>›</div>`;render()}).catch(()=>{document.getElementById('homeGame').textContent='棋譜データ読み込みエラー'});</script></body></html>
