function issueAnalysis(i){return analysisIssues.find(a=>a.ply===i.ply)||null}function samePiece(a,b){return!!a&&!!b&&a.side===b.side&&a.key===b.key}function squareUsi(f,r){return String(f)+'abcdefghi'[r-1]}function inferredActualMove(movePly){if(movePly<1)return null;const before=parseSFEN(D.positions[movePly-1].sfen),after=parseSFEN(D.positions[movePly].sfen),side=before.turn,from=[],to=[];for(let r=1;r<=9;r++)for(let f=1;f<=9;f++){const a=boardPiece(before,f,r),b=boardPiece(after,f,r);if(a&&a.side===side&&!samePiece(a,b))from.push({file:f,rank:r,piece:a});if(b&&b.side===side&&!samePiece(a,b))to.push({file:f,rank:r,piece:b})}if(!from.length&&to.length===1)return to[0].piece.key.replace('+','')+'*'+squareUsi(to[0].file,to[0].rank);if(from.length===1&&to.length===1)return squareUsi(from[0].file,from[0].rank)+squareUsi(to[0].file,to[0].rank)+(to[0].piece.key[0]==='+'&&from[0].piece.key[0]!=='+'?'+':'');return null}function actualMove(i){return(D.positions[i.ply]||{}).usi||inferredActualMove(i.ply)||((issueAnalysis(i)||{}).played)||null}function bestMove(i){const a=issueAnalysis(i);return(a&&a.best)||i.best||null}
function previousDestination(movePly){if(movePly<=1)return null;const p=D.positions[movePly-1]||{},u=usiCoords(p.usi);if(u)return u.to;const s=p.last||'',m=s.match(/([1-9１-９])([一二三四五六七八九1-9])/);if(m){const f='１２３４５６７８９'.includes(m[1])?'１２３４５６７８９'.indexOf(m[1])+1:+m[1],r=rk.includes(m[2])?rk.indexOf(m[2])+1:+m[2];return{file:f,rank:r}}return/^同/.test(s)?previousDestination(movePly-1):null}
function clearPath(x,from,to){const sf=Math.sign(to.file-from.file),sr=Math.sign(to.rank-from.rank);for(let f=from.file+sf,r=from.rank+sr;f!==to.file||r!==to.rank;f+=sf,r+=sr)if(boardPiece(x,f,r))return false;return true}
function canReach(key,from,to,side,x){const df=Math.abs(to.file-from.file),dr=to.rank-from.rank,forward=side==='b'?-dr:dr;if(!df&&!dr)return false;switch(key){case'P':return df===0&&forward===1;case'L':return df===0&&forward>0&&clearPath(x,from,to);case'N':return df===1&&forward===2;case'S':return(forward===1&&df<=1)||(forward===-1&&df===1);case'G':case'+P':case'+L':case'+N':case'+S':return(forward===1&&df<=1)||(forward===0&&df===1)||(forward===-1&&df===0);case'K':return df<=1&&Math.abs(dr)<=1;case'B':return df===Math.abs(dr)&&clearPath(x,from,to);case'R':return(df===0||dr===0)&&clearPath(x,from,to);case'+B':return(df===Math.abs(dr)&&clearPath(x,from,to))||(df+Math.abs(dr)===1);case'+R':return((df===0||dr===0)&&clearPath(x,from,to))||(df===1&&Math.abs(dr)===1);default:return false}}
function moveQualifier(a,x,side,key){if(a.drop)return'';const candidates=[];for(let r=1;r<=9;r++)for(let f=1;f<=9;f++){const q=boardPiece(x,f,r);if(q&&q.side===side&&q.key===key&&canReach(key,{file:f,rank:r},a.to,side,x))candidates.push({file:f,rank:r})}if(candidates.length<2)return'';const h=p=>p.file===a.to.file?'直':side==='b'?(p.file<a.to.file?'右':'左'):(p.file>a.to.file?'右':'左'),v=p=>p.rank===a.to.rank?'寄':side==='b'?(p.rank>a.to.rank?'上':'引'):(p.rank<a.to.rank?'上':'引'),src=candidates.find(p=>p.file===a.from.file&&p.rank===a.from.rank);if(!src)return'';const hs=h(src),vs=v(src);if(candidates.filter(p=>h(p)===hs).length===1)return hs;if(candidates.filter(p=>v(p)===vs).length===1)return vs;return hs+vs}

function formatMove(m,x,side,prev){const a=usiCoords(m);if(!a)return'-';const key=a.drop?a.piece:((boardPiece(x,a.from.file,a.from.rank)||{}).key||'?'),same=prev&&prev.file===a.to.file&&prev.rank===a.to.rank,dest=same?'同':String(a.to.file)+rk[a.to.rank-1],name=jp[key]||key,qualifier=moveQualifier(a,x,side,key),ending=a.drop?'打':a.promote?'成':canDeclinePromotion(key,a,side)?'不成':'';return(side==='b'?'▲':'△')+dest+name+qualifier+ending}
function arrowLine(a,c,id){if(!a||a.drop)return'';const p=cellCenter(a.from.file,a.from.rank),q=cellCenter(a.to.file,a.to.rank),dx=q.x-p.x,dy=q.y-p.y,l=Math.hypot(dx,dy)||1;return`<line x1="${p.x}" y1="${p.y}" x2="${q.x-dx/l*28}" y2="${q.y-dy/l*28}" stroke="${c}" stroke-width="15" stroke-linecap="round" opacity=".9" marker-end="url(#${id})"/>`}function target(a,c,t){if(!a)return'';const p=cellCenter(a.to.file,a.to.rank);return`<rect x="${p.x-45}" y="${p.y-45}" width="90" height="90" rx="9" fill="none" stroke="${c}" stroke-width="9"/>${a.drop?`<text x="${p.x}" y="${p.y+9}" text-anchor="middle" font-size="30" font-weight="700" fill="${c}">${t}</text>`:''}`}function drawArrows(i){const s=document.getElementById('arrows');if(!i){s.innerHTML='';return}const a=usiCoords(actualMove(i)),b=usiCoords(bestMove(i));s.innerHTML=`<defs><marker id="rh" markerUnits="userSpaceOnUse" markerWidth="45" markerHeight="45" refX="38" refY="22" orient="auto"><path d="M0,0 L0,44 L42,22 z" fill="#ff4938"/></marker><marker id="gh" markerUnits="userSpaceOnUse" markerWidth="45" markerHeight="45" refX="38" refY="22" orient="auto"><path d="M0,0 L0,44 L42,22 z" fill="#38d86a"/></marker></defs>${arrowLine(a,'#ff4938','rh')}${target(a,'#ff4938','実')}${arrowLine(b,'#38d86a','gh')}${target(b,'#38d86a','推')}`}
function evalAt(p){if(!evalSente.length)return 0;let a=evalSente[0],b=evalSente[evalSente.length-1];for(let i=1;i<evalSente.length;i++)if(evalSente[i][0]>=p){a=evalSente[i-1];b=evalSente[i];break}const t=b[0]===a[0]?0:(p-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*t}function evalLabel(v){const a=Math.abs(v);return(a<300?'互角':a<800?(v>0?'自分やや有利':'相手やや有利'):a<2000?(v>0?'自分有利':'相手有利'):(v>0?'自分優勢':'相手優勢'))+` ${v>=0?'+':''}${v}`}function drawEval(){if(!evalSente.length){evalText.textContent='評価値なし';evalGraph.innerHTML='';return}const sign=userSide()==='b'?1:-1,vals=evalSente.map(([p,v])=>[p,v*sign]),cap=8000,pts=vals.map(([p,v])=>`${p/D.game.moves*400},${50-Math.max(-cap,Math.min(cap,v))/cap*43}`).join(' '),cx=ply/D.game.moves*400,ev=Math.round(evalAt(ply)*sign);evalText.textContent=evalLabel(ev);evalGraph.innerHTML=`<line x1="0" y1="50" x2="400" y2="50" stroke="#6c6255"/><polyline points="${pts}" fill="none" stroke="#e9bd72" stroke-width="4" vector-effect="non-scaling-stroke"/><line x1="${cx}" y1="3" x2="${cx}" y2="97" stroke="#fff" stroke-width="2" opacity=".85"/>${D.issues.map(i=>`<circle cx="${i.ply/D.game.moves*400}" cy="${50-Math.max(-cap,Math.min(cap,evalAt(i.ply)*sign))/cap*43}" r="5" fill="#e85a49"/>`).join('')}`}function seekEval(e){if(!D)return;const r=evalGraph.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left));ply=Math.max(0,Math.min(D.positions.length-1,Math.round(x/r.width*D.game.moves)));render()}
function render(){if(!D)return;if(!viewSide)viewSide=userSide();renderCoordinates();const issue=D.issues.find(i=>i.ply===ply),dp=issue?Math.max(0,ply-1):ply,x=parseSFEN(D.positions[dp].sfen),bd=board;bd.replaceChildren();for(let vi=0;vi<81;vi++){const q=x.cells[viewSide==='w'?80-vi:vi],e=document.createElement('div');e.className='sq';if(q){const k=document.createElement('span');k.className='piece '+(q.side===viewSide?'home':'away');k.textContent=jp[q.key]||q.key;e.appendChild(k)}bd.appendChild(e)}const h=splitHands(x.h),top=opponent(viewSide),shown=D.positions[ply],mover=ply%2?'b':'w',prev=issue?previousDestination(issue.ply):null,actual=issue?formatMove(actualMove(issue),x,mover,prev):'',best=issue?formatMove(bestMove(issue),x,mover,prev):'';topLabel.textContent=sideMark(top)+' '+(top===userSide()?'自分':'相手');bottomLabel.textContent=sideMark(viewSide)+' '+(viewSide===userSide()?'自分':'相手');topHand.innerHTML=handHtml(h[top],top);bottomHand.innerHTML=handHtml(h[viewSide],viewSide);last.textContent=issue?'指す直前：'+actual:shown.last;counter.textContent=`${ply}/${D.game.moves}手`;drawArrows(issue);drawEval();review.innerHTML=issue?`<div class="card warn"><h2>⚠ 課題局面</h2><div class="legend"><span class="red">● 赤＝実戦</span>　<span class="green">● 緑＝推奨</span></div><div class="compare"><div class="choice bad"><small>あなたの手</small><strong>${actual}</strong></div><div class="choice good"><small>水匠5 推奨</small><strong>${best}</strong></div></div><div class="loss">評価値損失 約${issue.loss}点</div><div class="comment">💬 ${issue.comment}</div></div>`:'<div class="card normal">この局面には大きな課題判定はありません。▶で一手ずつ進められます。</div>'}function step(n){ply=Math.max(0,Math.min(D.positions.length-1,ply+n));render()}function nextIssue(){if(!D.issues.length)return;const n=D.issues.find(i=>i.ply>ply);ply=n?n.ply:D.issues[0].ply;render()}
function renderGameList(){gameCount.textContent=`${catalog.length}局`;gameList.replaceChildren(...catalog.map(g=>{const row=document.createElement('div'),grow=document.createElement('div'),name=document.createElement('b'),meta=document.createElement('div');row.className=`gameRow ${g.id===currentGameId?'active':''}`;grow.className='grow';meta.className='sub';name.textContent=g.title;meta.textContent=`${g.date} / ${g.side} / ${g.moves}手 / ${g.analyzed?'解析済み':'未解析'}`;grow.append(name,meta);row.append(grow,document.createTextNode('›'));row.addEventListener('click',()=>loadGame(g.id,true));return row}))}
async function loadGame(id,openReview=false){const g=catalog.find(x=>x.id===id);if(!g)return;try{const [d,a]=await Promise.all([fetch(`${g.gameData}?v=19`).then(r=>{if(!r.ok)throw new Error(g.gameData);return r.json()}),fetch(`${g.analysisData}?v=19`).then(r=>{if(!r.ok)throw new Error(g.analysisData);return r.json()})]);D=d;currentGameId=id;evalSente=(a.evaluations||[]).map(e=>[e.ply,e.cp]).sort((x,y)=>x[0]-y[0]);analysisIssues=a.verifiedIssues||[];ply=0;viewSide=userSide();title.textContent=d.game.title;result.textContent=d.game.result;homeGame.textContent=`${d.game.date} ${d.game.title}`;issueCount.textContent=d.issues.length;renderGameList();render();if(openReview)showView('reviewView')}catch(err){console.error(err);homeGame.textContent='対局データの読み込みに失敗しました'}}
async function refreshCatalog(){const r=await fetch(`games/index.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('games/index.json');const c=await r.json();catalog=c.games||[];renderGameList();return catalog}window.refreshCatalog=refreshCatalog;window.loadGame=loadGame;
refreshCatalog().then(()=>{if(catalog.length)return loadGame(catalog[0].id)}).catch(err=>{console.error(err);homeGame.textContent='棋譜一覧の読み込みに失敗しました'});
</script><script src="review-enhanced.js?v=21"></script><script src="game-summary.js?v=21"></script><script type="module" src="kif-submit-ui.mjs"></script></body></html>
