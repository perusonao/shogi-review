name: Build game data

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Game ID (example: 20260910_taatoru_cat)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Convert requested game (artifact check only)
        env:
          GAME_ID: ${{ inputs.game_id }}
        run: |
          test -f "games/${GAME_ID}.kif"
          python tools/kif_to_game.py "games/${GAME_ID}.kif" --id "${GAME_ID}" --user sonao81 --out "games/${GAME_ID}.json"

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import glob, json
          for path in glob.glob('games/*.json'):
              if path.endswith('/index.json'):
                  continue
              with open(path, encoding='utf-8') as f:
                  data=json.load(f)
              assert data.get('positions'), f'{path}: positions missing'
              assert data['positions'][0]['ply'] == 0, f'{path}: initial position missing'
              assert data.get('game',{}).get('id'), f'{path}: game id missing'
              print(path, len(data['positions'])-1, 'moves OK')
          PY

      - name: Explain output
        run: echo 'Validation only. Use analyze-new-games.bat for production data and Suisho5 analysis.'
